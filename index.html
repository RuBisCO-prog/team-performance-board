<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Workload Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--wb-bg,#f8f8f8);min-height:100vh}
.wb-root{padding:2rem 0 3rem;text-align:center}
.wb-heading{font-size:28px;font-weight:300;color:#111;letter-spacing:-.02em;margin-bottom:1.8rem}
.wb-heading span{font-weight:600}
.scroll-wrap{overflow-x:auto;padding:0 1.5rem 1.5rem;scrollbar-width:thin;scrollbar-color:#ccc transparent}
.scroll-wrap::-webkit-scrollbar{height:4px}
.scroll-wrap::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}
.cards-row{display:flex;gap:16px;align-items:flex-start;width:max-content;padding-bottom:4px}
.tm-card{background:#fff;border:0.5px solid #e2e2e2;border-radius:16px;width:230px;transition:border-color .2s,box-shadow .2s;position:relative}
.tm-card:hover{border-color:#bbb}
.tm-card.card-drag-over{border-color:#6366f1;box-shadow:0 0 0 2px #e0e7ff}
.tm-card.card-dragging{opacity:.4}
.card-inner{border-radius:16px;overflow:hidden;background:transparent}
.card-header{padding:20px 14px 14px;position:relative;user-select:none;text-align:center}
.avatar{width:52px;height:52px;border-radius:50%;background:#e0e7ff;color:#4f46e5;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;letter-spacing:.02em;cursor:grab}
.avatar:active{cursor:grabbing}
.load-bar-wrap{margin-top:4px}
.load-bar-bg{height:4px;border-radius:2px;background:#f0f0f0;overflow:hidden}
.load-bar-fill{height:100%;border-radius:2px;transition:width .4s,background .4s}
.load-label{font-size:13px;margin-top:5px;font-weight:600;letter-spacing:.01em}
.three-dot-btn{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:7px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:18px;transition:all .15s;z-index:2;line-height:1;letter-spacing:1px;padding-bottom:4px}
.three-dot-btn:hover{background:#f3f3f3;color:#333}
.dot-menu{position:absolute;top:38px;right:10px;background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:6px;z-index:100;min-width:170px;max-height:220px;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.dot-menu::-webkit-scrollbar{width:3px}
.dot-menu::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.dot-menu-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:12px;color:#222;cursor:pointer;transition:background .15s;user-select:none;white-space:nowrap}
.dot-menu-item:hover{background:#f5f5f5}
.dot-menu-item.danger{color:#dc2626}
.dot-menu-item.danger:hover{background:#fef2f2}
.dot-menu-divider{height:0.5px;background:#eee;margin:4px 0}
.header-edit{display:none;padding:0 14px 12px;border-bottom:0.5px solid #eee}
.header-edit.open{display:block}
.edit-field{margin-bottom:8px}
.edit-label-sm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#999;margin-bottom:3px}
.edit-input{width:100%;font-size:13px;padding:5px 8px;border-radius:8px;border:0.5px solid #ddd;background:#fafafa;color:#111;font-family:inherit;outline:none}
.edit-input:focus{border-color:#6366f1}
.tasks-wrap{padding:8px 10px 4px}
.outbox{display:flex;align-items:center;gap:7px;padding:6px 4px;border-bottom:0.5px solid #f0f0f0;cursor:pointer;border-radius:8px;transition:background .15s;user-select:none}
.outbox:last-child{border-bottom:none}
.outbox:hover{background:#fafafa}
.drag-handle{font-size:13px;color:#ccc;cursor:grab;flex-shrink:0;opacity:0;transition:opacity .15s}
.outbox:hover .drag-handle{opacity:1}
.out-done-btn{width:14px;height:14px;border-radius:50%;border:1px solid #ddd;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;transition:all .15s}
.out-done-btn.done{background:#22c55e;border-color:#22c55e;color:#fff}
.out-text{flex:1;min-width:0;text-align:left}
.out-name{font-size:12px;color:#111;line-height:1.3;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out-name.done-text{text-decoration:line-through;color:#aaa}
.out-wp{font-size:10px;color:#aaa;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out-badges{display:flex;gap:3px;flex-shrink:0;align-items:center}
.badge{font-size:10px;padding:1px 6px;border-radius:20px;border:0.5px solid #e5e5e5;color:#666;background:#f5f5f5;white-space:nowrap}
.badge.over{border-color:#fca5a5;color:#dc2626;background:#fef2f2}
.badge-w{font-size:10px;padding:1px 7px;border-radius:20px;white-space:nowrap;font-weight:500;border:none}
.drop-zone{min-height:6px;transition:all .2s;border-radius:8px}
.drop-zone.active{background:#e0e7ff;min-height:28px;border:1px dashed #6366f1}
.add-task-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:#aaa;cursor:pointer;padding:6px 10px;border-radius:8px;transition:all .15s;font-family:inherit;width:100%;border:none;background:transparent;text-align:left;margin-top:2px}
.add-task-btn:hover{background:#f5f5f5;color:#333}
.add-tm-area{display:flex;justify-content:center;margin-top:16px}
.add-tm-btn{font-size:11px;color:#aaa;cursor:pointer;padding:8px 20px;border-radius:20px;border:0.5px dashed #ccc;background:transparent;font-family:inherit;transition:all .15s}
.add-tm-btn:hover{background:#f5f5f5;color:#333;border-style:solid}
.inbox-overlay{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.35)}
.inbox-overlay.open{display:flex;align-items:center;justify-content:center}
.inbox-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:20px;width:min(480px,92vw);max-height:85vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.inbox-card::-webkit-scrollbar{width:3px}
.inbox-card::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.inbox-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.inbox-done-btn{width:20px;height:20px;border-radius:50%;border:1.5px solid #ddd;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;margin-top:2px;transition:all .15s}
.inbox-done-btn.done{background:#22c55e;border-color:#22c55e;color:#fff}
.inbox-name{font-size:18px;font-weight:600;color:#111;border:none;background:transparent;outline:none;font-family:inherit;flex:1;line-height:1.3;resize:none;overflow:hidden}
.inbox-name:focus{border-bottom:1px solid #ddd}
.inbox-top-actions{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}
.inbox-icon-btn{width:26px;height:26px;border-radius:8px;border:0.5px solid #eee;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px;transition:all .15s}
.inbox-icon-btn:hover{background:#f5f5f5;color:#333}
.copy-tm-menu{background:#f9f9f9;border:0.5px solid #e5e5e5;border-radius:12px;padding:6px;margin-bottom:14px}
.copy-tm-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:12px;color:#222;cursor:pointer;transition:background .15s}
.copy-tm-item:hover{background:#fff}
.inbox-section{margin-bottom:16px}
.inbox-section-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-bottom:8px;font-weight:500}
.inbox-fields-row{display:flex;gap:10px}
.inbox-field{flex:1}
.inbox-field-label{font-size:11px;color:#888;margin-bottom:4px}
.inbox-num{width:100%;font-size:14px;padding:7px 10px;border-radius:10px;border:0.5px solid #e0e0e0;background:#fafafa;color:#111;font-family:inherit;outline:none;text-align:center}
.inbox-num:focus{border-color:#6366f1}
.inbox-date,.inbox-select{width:100%;font-size:13px;padding:7px 10px;border-radius:10px;border:0.5px solid #e0e0e0;background:#fafafa;color:#111;font-family:inherit;outline:none}
.inbox-date:focus,.inbox-select:focus{border-color:#6366f1}
.inbox-date.over{border-color:#fca5a5;color:#dc2626;background:#fef2f2}
.inbox-desc{width:100%;font-size:13px;padding:8px 10px;border-radius:10px;border:0.5px solid #e0e0e0;background:#fafafa;color:#111;font-family:inherit;outline:none;resize:none;line-height:1.6;min-height:70px}
.inbox-desc:focus{border-color:#6366f1}
.subtask-row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:0.5px solid #f0f0f0}
.subtask-row:last-child{border-bottom:none}
.subtask-row.dragging{opacity:.4}
.subtask-row.sub-drag-over{border-top:2px solid #6366f1}
.sub-drag-handle{font-size:13px;color:#ccc;cursor:grab;opacity:0;transition:opacity .15s;flex-shrink:0}
.subtask-row:hover .sub-drag-handle{opacity:1}
.sub-check{width:15px;height:15px;border-radius:4px;border:1px solid #ddd;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:all .15s}
.sub-check.done{background:#22c55e;border-color:#22c55e;color:#fff}
.sub-input{flex:1;font-size:13px;border:none;background:transparent;outline:none;font-family:inherit;color:#111}
.sub-input.done-text{text-decoration:line-through;color:#aaa}
.sub-del{font-size:14px;color:#ccc;cursor:pointer;opacity:0;transition:opacity .15s;background:transparent;border:none;padding:0 2px;line-height:1}
.subtask-row:hover .sub-del{opacity:1}
.sub-del:hover{color:#dc2626}
.add-sub-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:#aaa;cursor:pointer;padding:5px 0;background:transparent;border:none;font-family:inherit;transition:color .15s;margin-top:4px}
.add-sub-btn:hover{color:#333}
.inbox-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:0.5px solid #eee}
.inbox-del-btn{font-size:12px;color:#aaa;background:transparent;border:none;cursor:pointer;font-family:inherit;transition:color .15s;display:flex;align-items:center;gap:4px}
.inbox-del-btn:hover{color:#dc2626}
.inbox-close-btn{font-size:12px;color:#555;background:#f5f5f5;border:0.5px solid #e0e0e0;cursor:pointer;font-family:inherit;padding:6px 16px;border-radius:20px;transition:all .15s}
.inbox-close-btn:hover{color:#111}
</style>
</head>
<body>
<div class="wb-root">
  <div class="wb-heading">Work<span>load</span></div>
  <div class="scroll-wrap">
    <div class="cards-row" id="cards"></div>
  </div>
  <div class="add-tm-area">
    <button class="add-tm-btn" onclick="addTM()">+ Add team member</button>
  </div>
</div>
<div class="inbox-overlay" id="inbox-overlay" onclick="handleOverlayClick(event)">
  <div class="inbox-card" id="inbox-card" onclick="event.stopPropagation()"></div>
</div>

<script>
const SUPA_URL='https://oqkpqdxjjkpmbabijvsf.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xa3BxZHhqamtwbWJhYmlqdnNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NzMzNzIsImV4cCI6MjA5NjI0OTM3Mn0.VVYVzmoCLsDyV1Cea2WcorTNjyMw6zlw6AmlmUq0sZI';
const db=supabase.createClient(SUPA_URL,SUPA_KEY);

let tms=[],tasks=[],subtasks=[],wps=[];
let openTaskId=null,openDotMenu=null,showCopyMenu=false,pendingTaskId=null;
let nextTMId=5,nextTaskId=1,nextSubId=1;
let dragTaskId=null,subDragging=null,dragCardId=null,dragOverCardId=null;

function isOverdue(dl){if(!dl)return false;return new Date(dl)<new Date(new Date().toDateString());}
function wVal(t){return t.weight===''||t.weight==null?0:+t.weight;}
function loadScore(tmId){return tasks.filter(t=>t.tmId===tmId&&!t.done).reduce((s,t)=>s+wVal(t),0);}
function loadColor(s){
  if(s>12)return'#8b0000';
  if(s>=10)return'#cc1a1a';
  if(s>=7)return'#e05020';
  if(s>=5)return'#d97706';
  if(s>=3)return'#ca8a04';
  return'#16a34a';
}
function loadPct(s){return Math.min(s/14*100,100);}
function fmt(d){if(!d)return'';const p=d.split('-');return p.length!==3?d:p[2]+'/'+p[1];}
function sortedTasks(tmId){return tasks.filter(t=>t.tmId===tmId).sort((a,b)=>wVal(b)-wVal(a));}
function weightBadgeStyle(w){
  const v=Math.max(0,Math.min(10,+w||0)),t=v/10;
  const r=Math.round(34+t*190),g=Math.round(197-t*150),b=Math.round(94-t*60);
  return'background:rgba('+r+','+g+','+b+',.15);color:rgb('+r+','+g+','+b+');border:0.5px solid rgba('+r+','+g+','+b+',.4)';
}
function wpName(wpId){const w=wps.find(w=>w.id===wpId);return w?w.name:'';}

function render(){
  const wrap=document.getElementById('cards');
  wrap.innerHTML=tms.map(tm=>{
    const myTasks=sortedTasks(tm.id),score=loadScore(tm.id),col=loadColor(score),pct=loadPct(score);
    const isDot=openDotMenu===tm.id;
    return'<div class="tm-card'+(dragCardId===tm.id?' card-dragging':'')+(dragOverCardId===tm.id?' card-drag-over':'')+'" id="card-'+tm.id+'" draggable="true" ondragstart="cardDragStart(event,'+tm.id+')" ondragend="cardDragEnd()" ondragover="cardDragOver(event,'+tm.id+')" ondragleave="cardDragLeave(event,'+tm.id+')" ondrop="cardDrop(event,'+tm.id+')">'+
      '<div class="card-inner">'+
      '<div class="card-header">'+
      '<div class="avatar" id="av-'+tm.id+'" title="Drag to reorder">'+tm.initials.substring(0,4)+'</div>'+
      '<div class="load-bar-wrap">'+
      '<div class="load-bar-bg"><div class="load-bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div>'+
      '<div class="load-label" style="color:'+col+'">'+score+'</div>'+
      '</div>'+
      '<button class="three-dot-btn" onclick="toggleDotMenu(event,'+tm.id+')" aria-label="Options">\u00b7\u00b7\u00b7</button>'+
      (isDot?'<div class="dot-menu" onclick="event.stopPropagation()">'+
        '<div class="dot-menu-item" onclick="openHeaderEdit('+tm.id+')">&#9998; Edit member</div>'+
        '<div class="dot-menu-item" onclick="copyTM('+tm.id+')">&#10697; Copy member</div>'+
        '<div class="dot-menu-divider"></div>'+
        '<div class="dot-menu-item danger" onclick="removeTM('+tm.id+')">&#128465; Remove member</div>'+
      '</div>':'')+
      '</div>'+
      '<div class="header-edit'+(tm.headerOpen?' open':'')+'" id="hedit-'+tm.id+'">'+
        '<div class="edit-field"><div class="edit-label-sm">Initials</div>'+
        '<input class="edit-input" value="'+tm.initials+'" maxlength="4" placeholder="e.g. TM1" oninput="updateTM('+tm.id+',\'initials\',this.value)"></div>'+
      '</div>'+
      '<div class="tasks-wrap" id="tasks-'+tm.id+'">'+
      '<div class="drop-zone" id="dz-'+tm.id+'-top" ondragover="dzOver(event,\''+tm.id+'-top\')" ondragleave="dzLeave(\''+tm.id+'-top\')" ondrop="dzDrop(event,'+tm.id+',0)"></div>'+
      myTasks.map((t,i)=>{
        const over=isOverdue(t.deadline),wS=weightBadgeStyle(wVal(t)),wp=wpName(t.wpId);
        return '<div class="outbox" id="out-'+t.id+'" draggable="true" ondragstart="taskDragStart(event,'+t.id+')" ondragend="taskDragEnd()" onclick="openInbox('+t.id+')">'+
          '<span style="font-size:13px;color:#ccc;cursor:grab;flex-shrink:0;opacity:0;transition:opacity .15s" class="drag-handle">\u2630</span>'+
          '<div class="out-done-btn'+(t.done?' done':'')+'" onclick="event.stopPropagation();toggleDone('+t.id+')">'+(t.done?'&#10003;':'')+'</div>'+
          '<div class="out-text">'+
          '<span class="out-name'+(t.done?' done-text':'')+'">'+t.name+'</span>'+
          (wp?'<span class="out-wp">'+wp+'</span>':'')+
          '</div>'+
          '<div class="out-badges">'+
          '<span class="badge-w" style="'+wS+'">W'+wVal(t)+'</span>'+
          (t.crit!==''&&t.crit!=null?'<span class="badge">C'+t.crit+'</span>':'')+
          (t.deadline?'<span class="badge'+(over?' over':'')+'">&#128197; '+fmt(t.deadline)+'</span>':'')+
          '</div></div>'+
          '<div class="drop-zone" id="dz-'+tm.id+'-'+(i+1)+'" ondragover="dzOver(event,\''+tm.id+'-'+(i+1)+'\')" ondragleave="dzLeave(\''+tm.id+'-'+(i+1)+'\')" ondrop="dzDrop(event,'+tm.id+','+(i+1)+')"></div>';
      }).join('')+
      '<button class="add-task-btn" onclick="startAddTask('+tm.id+')">+ Add task</button>'+
      '</div></div></div>';
  }).join('');
}

function renderInbox(taskId){
  const t=tasks.find(t=>t.id===taskId);
  if(!t){closeInbox();return;}
  const over=isOverdue(t.deadline),subs=subtasks.filter(s=>s.taskId===taskId);
  const wV=t.weight===''||t.weight==null?'':t.weight,cV=t.crit===''||t.crit==null?'':t.crit;
  document.getElementById('inbox-card').innerHTML=
    '<div><div class="inbox-top">'+
    '<div class="inbox-done-btn'+(t.done?' done':'')+'" onclick="toggleDone('+t.id+');renderInbox('+t.id+')">'+(t.done?'&#10003;':'')+'</div>'+
    '<textarea class="inbox-name" rows="1" placeholder="Task name\u2026" oninput="updateTask('+t.id+',\'name\',this.value);autoResize(this)">'+t.name+'</textarea>'+
    '<div class="inbox-top-actions">'+
    '<button class="inbox-icon-btn" onclick="toggleCopyMenu()" title="Copy task to\u2026">&#10697;</button>'+
    '<button class="inbox-icon-btn" onclick="closeInbox()" title="Close">&times;</button>'+
    '</div></div>'+
    (showCopyMenu?'<div class="copy-tm-menu"><div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#aaa;padding:4px 10px 6px">Copy to\u2026</div>'+
      tms.filter(m=>m.id!==t.tmId).map(m=>'<div class="copy-tm-item" onclick="copyTaskTo('+t.id+','+m.id+')">'+
        '<div style="width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#4f46e5;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center">'+m.initials.substring(0,4)+'</div>'+m.initials+'</div>').join('')+
    '</div>':'')+
    '</div>'+
    '<div class="inbox-section"><div class="inbox-section-label">Details</div>'+
    '<div class="inbox-fields-row" style="margin-bottom:10px">'+
    '<div class="inbox-field"><div class="inbox-field-label">Weight</div><input class="inbox-num" type="number" min="0" max="10" value="'+wV+'" placeholder="0\u201310" onchange="updateTask('+t.id+',\'weight\',this.value===\'\'?\'\':Math.min(10,Math.max(0,+this.value)))"></div>'+
    '<div class="inbox-field"><div class="inbox-field-label">Criticality</div><input class="inbox-num" type="number" min="0" max="10" value="'+cV+'" placeholder="0\u201310" onchange="updateTask('+t.id+',\'crit\',this.value===\'\'?\'\':Math.min(10,Math.max(0,+this.value)))"></div>'+
    '</div>'+
    '<div class="inbox-fields-row">'+
    '<div class="inbox-field"><div class="inbox-field-label">Work package</div><select class="inbox-select" onchange="updateTask('+t.id+',\'wpId\',this.value)"><option value="">None</option>'+
      wps.map(w=>'<option value="'+w.id+'"'+(t.wpId===w.id?' selected':'')+'>'+w.name+'</option>').join('')+'</select></div>'+
    '<div class="inbox-field"><div class="inbox-field-label">Deadline</div><input type="date" class="inbox-date'+(over?' over':'')+'" value="'+(t.deadline||'')+'" oninput="updateTask('+t.id+',\'deadline\',this.value);renderInbox('+t.id+')"></div>'+
    '</div></div>'+
    '<div class="inbox-section"><div class="inbox-section-label">Description</div>'+
    '<textarea class="inbox-desc" placeholder="Add notes\u2026" oninput="updateTask('+t.id+',\'desc\',this.value)">'+( t.desc||'')+'</textarea></div>'+
    '<div class="inbox-section"><div class="inbox-section-label">Subtasks</div><div id="subtasks-list">'+
    subs.map(s=>'<div class="subtask-row" id="sub-'+s.id+'" draggable="true" ondragstart="subDragStart(event,'+s.id+')" ondragover="subDragOver(event,'+s.id+')" ondragleave="subDragLeave('+s.id+')" ondragend="subDragEnd()" ondrop="subDrop(event,'+s.id+')">'+
      '<span style="font-size:13px;color:#ccc;cursor:grab;opacity:0;transition:opacity .15s;flex-shrink:0" class="sub-drag-handle">\u2630</span>'+
      '<div class="sub-check'+(s.done?' done':'')+'" onclick="toggleSub('+s.id+')">'+(s.done?'&#10003;':'')+'</div>'+
      '<input class="sub-input'+(s.done?' done-text':'')+'" value="'+s.name+'" placeholder="Subtask\u2026" oninput="updateSub('+s.id+',\'name\',this.value)">'+
      '<button class="sub-del" onclick="deleteSub('+s.id+')">&times;</button>'+
    '</div>').join('')+
    '</div><button class="add-sub-btn" onclick="addSub('+taskId+')">+ Add subtask</button></div>'+
    '<div class="inbox-actions">'+
    '<button class="inbox-del-btn" onclick="deleteTask('+t.id+')">&#128465; Delete task</button>'+
    '<button class="inbox-close-btn" onclick="closeInbox()">Close</button>'+
    '</div>';
  document.querySelectorAll('.inbox-name').forEach(autoResize);
}

function autoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function openInbox(taskId){openTaskId=taskId;showCopyMenu=false;document.getElementById('inbox-overlay').classList.add('open');renderInbox(taskId);}
function closeInbox(){
  if(pendingTaskId){const t=tasks.find(t=>t.id===pendingTaskId);if(t&&!t.name.trim())tasks=tasks.filter(t=>t.id!==pendingTaskId);pendingTaskId=null;}
  openTaskId=null;showCopyMenu=false;document.getElementById('inbox-overlay').classList.remove('open');render();
}
function handleOverlayClick(e){if(e.target===document.getElementById('inbox-overlay'))closeInbox();}
function toggleCopyMenu(){showCopyMenu=!showCopyMenu;renderInbox(openTaskId);}
function copyTaskTo(taskId,toTmId){
  const t=tasks.find(t=>t.id===taskId);if(!t)return;
  const nid=nextTaskId++;tasks.push(Object.assign({},t,{id:nid,tmId:toTmId}));
  subtasks.filter(s=>s.taskId===taskId).forEach(s=>subtasks.push(Object.assign({},s,{id:nextSubId++,taskId:nid})));
  showCopyMenu=false;renderInbox(openTaskId);render();
}
function toggleDotMenu(e,tmId){e.stopPropagation();openDotMenu=openDotMenu===tmId?null:tmId;render();}
function openHeaderEdit(tmId){openDotMenu=null;const tm=tms.find(t=>t.id===tmId);if(tm){tm.headerOpen=true;render();setTimeout(()=>{const el=document.querySelector('#hedit-'+tmId+' .edit-input');if(el)el.focus();},30);}}
function copyTM(tmId){
  const tm=tms.find(t=>t.id===tmId);if(!tm)return;
  const nid=nextTMId++;tms.push(Object.assign({},tm,{id:nid,initials:tm.initials+'*',headerOpen:false}));
  tasks.filter(t=>t.tmId===tmId).forEach(t=>{const tid=nextTaskId++;tasks.push(Object.assign({},t,{id:tid,tmId:nid}));subtasks.filter(s=>s.taskId===t.id).forEach(s=>subtasks.push(Object.assign({},s,{id:nextSubId++,taskId:tid})));});
  openDotMenu=null;render();
}
function removeTM(id){if(tms.length<=1)return;tms=tms.filter(t=>t.id!==id);tasks=tasks.filter(t=>t.tmId!==id);openDotMenu=null;render();}
function updateTM(id,field,val){const t=tms.find(t=>t.id===id);if(!t)return;t[field]=val;const av=document.getElementById('av-'+id);if(av)av.textContent=val.substring(0,4);}
function updateTask(id,field,val){const t=tasks.find(t=>t.id===id);if(t)t[field]=val;}
function toggleDone(id){const t=tasks.find(t=>t.id===id);if(t){t.done=!t.done;render();if(openTaskId===id)renderInbox(id);}}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);subtasks=subtasks.filter(s=>s.taskId!==id);pendingTaskId=null;closeInbox();}
function startAddTask(tmId){
  const id=nextTaskId++;pendingTaskId=id;
  tasks.push({id,tmId,name:'',weight:5,crit:5,wpId:'',deadline:'',desc:'',done:false});
  render();setTimeout(()=>{openTaskId=id;showCopyMenu=false;document.getElementById('inbox-overlay').classList.add('open');renderInbox(id);setTimeout(()=>{const el=document.querySelector('.inbox-name');if(el)el.focus();},30);},20);
}
function addTM(){tms.push({id:nextTMId++,initials:'TM'+(nextTMId-1),headerOpen:false});render();setTimeout(()=>openHeaderEdit(tms[tms.length-1].id),30);}
function addSub(taskId){const id=nextSubId++;subtasks.push({id,taskId,name:'',done:false});renderInbox(taskId);setTimeout(()=>{const inputs=document.querySelectorAll('.sub-input');if(inputs.length)inputs[inputs.length-1].focus();},30);}
function updateSub(id,f,v){const s=subtasks.find(s=>s.id===id);if(s)s[f]=v;}
function toggleSub(id){const s=subtasks.find(s=>s.id===id);if(s){s.done=!s.done;renderInbox(openTaskId);}}
function deleteSub(id){const s=subtasks.find(s=>s.id===id);const tid=s&&s.taskId;subtasks=subtasks.filter(s=>s.id!==id);if(tid)renderInbox(tid);}
function taskDragStart(e,id){dragTaskId=id;e.dataTransfer.effectAllowed='move';e.stopPropagation();setTimeout(()=>{const el=document.getElementById('out-'+id);if(el)el.style.opacity='.4';},0);}
function taskDragEnd(){if(dragTaskId){const el=document.getElementById('out-'+dragTaskId);if(el)el.style.opacity='1';}dragTaskId=null;document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('active'));}
function dzOver(e,key){if(dragTaskId===null)return;e.preventDefault();e.stopPropagation();const el=document.getElementById('dz-'+key);if(el)el.classList.add('active');}
function dzLeave(key){const el=document.getElementById('dz-'+key);if(el)el.classList.remove('active');}
function dzDrop(e,tmId,pos){
  e.preventDefault();e.stopPropagation();if(dragTaskId===null)return;
  const t=tasks.find(t=>t.id===dragTaskId);if(!t){dragTaskId=null;render();return;}
  tasks=tasks.filter(t=>t.id!==dragTaskId);
  const tmT=tasks.filter(t=>t.tmId===tmId),oth=tasks.filter(t=>t.tmId!==tmId);
  tmT.splice(pos,0,Object.assign({},t,{tmId}));tasks=oth.concat(tmT);dragTaskId=null;render();
}
function cardDragStart(e,tmId){
  if(dragTaskId!==null)return;
  dragCardId=tmId;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(tmId));
  setTimeout(()=>{const el=document.getElementById('card-'+tmId);if(el)el.classList.add('card-dragging');},0);
}
function cardDragEnd(){dragCardId=null;dragOverCardId=null;document.querySelectorAll('.tm-card').forEach(c=>c.classList.remove('card-dragging','card-drag-over'));}
function cardDragOver(e,tmId){
  if(dragCardId===null||dragCardId===tmId||dragTaskId!==null)return;
  e.preventDefault();e.stopPropagation();
  if(dragOverCardId!==tmId){dragOverCardId=tmId;render();}
}
function cardDragLeave(e,tmId){if(dragOverCardId===tmId){dragOverCardId=null;render();}}
function cardDrop(e,tmId){
  if(dragCardId===null||dragTaskId!==null)return;
  e.preventDefault();e.stopPropagation();
  if(dragCardId===tmId){dragCardId=null;dragOverCardId=null;render();return;}
  const fi=tms.findIndex(t=>t.id===dragCardId),ti=tms.findIndex(t=>t.id===tmId);
  if(fi>=0&&ti>=0){const m=tms.splice(fi,1)[0];tms.splice(ti,0,m);}
  dragCardId=null;dragOverCardId=null;render();
}
function subDragStart(e,id){subDragging=id;e.dataTransfer.effectAllowed='move';e.stopPropagation();setTimeout(()=>{const el=document.getElementById('sub-'+id);if(el)el.classList.add('dragging');},0);}
function subDragEnd(){subDragging=null;document.querySelectorAll('.subtask-row').forEach(r=>r.classList.remove('dragging','sub-drag-over'));}
function subDragOver(e,id){e.preventDefault();e.stopPropagation();if(subDragging===id)return;const el=document.getElementById('sub-'+id);if(el)el.classList.add('sub-drag-over');}
function subDragLeave(id){const el=document.getElementById('sub-'+id);if(el)el.classList.remove('sub-drag-over');}
function subDrop(e,tid){
  e.preventDefault();e.stopPropagation();if(subDragging===null||subDragging===tid)return;
  const tkId=openTaskId,subs=subtasks.filter(s=>s.taskId===tkId),oth=subtasks.filter(s=>s.taskId!==tkId);
  const fi=subs.findIndex(s=>s.id===subDragging),ti=subs.findIndex(s=>s.id===tid);
  if(fi<0||ti<0)return;const m=subs.splice(fi,1)[0];subs.splice(ti,0,m);
  subtasks=oth.concat(subs);subDragging=null;renderInbox(tkId);
}
document.addEventListener('click',function(e){
  if(openDotMenu&&!e.target.closest('.dot-menu')&&!e.target.closest('.three-dot-btn')){openDotMenu=null;render();}
  if(e.target.closest('.card-header')&&!e.target.closest('.three-dot-btn')&&!e.target.closest('.dot-menu')&&!e.target.closest('.header-edit')){
    const card=e.target.closest('.tm-card');
    if(card){const id=+card.id.replace('card-','');const tm=tms.find(t=>t.id===id);if(tm&&tm.headerOpen&&!e.target.closest('.edit-input')){tm.headerOpen=false;render();}}
  }
});
async function loadAll(){
  const [tmRes,taskRes,subRes,wpRes]=await Promise.all([
    db.from('team_members').select('*').order('position'),
    db.from('tasks').select('*').order('position'),
    db.from('subtasks').select('*').order('position'),
    db.from('work_packages').select('*')
  ]);
  tms=(tmRes.data||[]).map(r=>({id:r.id,initials:r.initials,headerOpen:false}));
  tasks=(taskRes.data||[]).map(r=>({id:r.id,tmId:r.tm_id,name:r.name,weight:r.weight,crit:r.criticality,wpId:r.wp_id,deadline:r.deadline||'',desc:r.description,done:r.done}));
  subtasks=(subRes.data||[]).map(r=>({id:r.id,taskId:r.task_id,name:r.name,done:r.done}));
  wps=(wpRes.data||[]).map(r=>({id:r.id,name:r.name}));
  nextTMId=tms.length?Math.max(...tms.map(t=>t.id))+1:1;
  nextTaskId=tasks.length?Math.max(...tasks.map(t=>t.id))+1:1;
  nextSubId=subtasks.length?Math.max(...subtasks.map(s=>s.id))+1:1;
  render();
}
loadAll();
</script>
</body>
</html>
